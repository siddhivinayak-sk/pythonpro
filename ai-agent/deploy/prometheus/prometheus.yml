# Prometheus scrape config for the AI-Agent services' /metrics endpoints.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: chat-api
    metrics_path: /metrics
    static_configs:
      - targets: ["chat-api:8080"]

  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:8081"]
