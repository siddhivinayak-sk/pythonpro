[project]
name = "ai-agent-workspace"
version = "0.1.0"
description = "AI-Agent Platform — monorepo workspace root (see docs/comprehensive-analysis.md)"
requires-python = ">=3.12"
# The root is a virtual workspace: it holds no runtime code, only tooling + members.

[tool.uv.workspace]
members = ["packages/*", "services/*"]

# Dev-only tooling shared across all workspace members (PEP 735 dependency group).
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# ---------------------------------------------------------------------------
# Shared tooling configuration (applies repo-wide)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/.venv", "**/node_modules", "**/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI uses function calls in argument defaults (Depends())
    "E501",  # line length is owned by `ruff format`; E501 otherwise only fires on docstrings/URLs
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["(^|/)(\\.venv|node_modules|dist|build)/"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["packages", "services"]
python_files = ["test_*.py"]
markers = [
    "integration: requires live services (pgvector/MCP/LLM); skipped unless RUN_INTEGRATION=1",
]
