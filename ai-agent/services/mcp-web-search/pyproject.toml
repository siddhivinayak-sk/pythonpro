[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-mcp-web-search"
version = "0.1.0"
description = "MCP server exposing web-grounding tools (web_search, fetch_url) over open-source search (SearXNG)."
requires-python = ">=3.12"
dependencies = [
    "ai-agent-core",
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Higher-quality main-content extraction (better nav/ad stripping than the bs4 heuristic):
extraction = ["trafilatura>=1.12"]
# Optional, key-free search provider:
duckduckgo = ["ddgs>=0.9"]

[project.scripts]
ai-agent-mcp-web-search = "ai_agent_mcp_web_search.server:main"

[tool.uv.sources]
ai-agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_mcp_web_search"]
