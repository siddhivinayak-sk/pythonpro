[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-evaluation"
version = "0.1.0"
description = "Evaluation suite for the RAG pipeline and the conversation agent (RAGAS + DeepEval)."
requires-python = ">=3.12"
dependencies = [
    "ai-agent-core",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

# Metric frameworks land in Phase 5 (kept optional so the CLI skeleton installs light):
[project.optional-dependencies]
metrics = ["ragas>=0.2", "deepeval>=1.0"]

[project.scripts]
ai-agent-eval = "ai_agent_eval.cli:main"

[tool.uv.sources]
ai-agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_eval"]
