server {
    listen 80;
    server_name _;

    # Proxy API calls to the chat backend (same-origin from the browser's perspective).
    location /v1/ {
        proxy_pass http://chat-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /healthz {
        proxy_pass http://chat-api:8080;
    }

    # SPA fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
