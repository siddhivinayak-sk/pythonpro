[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-rag"
version = "0.1.0"
description = "RAG application: multi-format ingestion, configurable vector store/embeddings/chunking, retrieval API + cron indexer."
requires-python = ">=3.12"
dependencies = [
    "ai-agent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
]

# Heavy / backend-specific dependencies are optional and imported lazily.
[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
chroma = ["chromadb>=0.5"]
ingestion = ["docling>=2.0"]        # multi-format parsing (PDF/Office/images w/ OCR)
embeddings-hf = ["sentence-transformers>=3.0"]

[project.scripts]
ai-agent-rag = "ai_agent_rag.app:main"

[tool.uv.sources]
ai-agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_rag"]
